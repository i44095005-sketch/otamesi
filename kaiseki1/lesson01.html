<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>第1講：導入、極限、挟み撃ちの原理 - 解析学Ⅰ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding-top: 60px;
    }

    /* 上部ナビ & サイドバー（既存共通） */
    .global-nav {
      position: fixed; top: 0; left: 0; width: 100%; height: 56px;
      background-color: #1a202c; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; z-index: 1000;
    }
    .nav-portal-title { font-weight: bold; font-size: 1rem; color: #fff; text-decoration: none; }
    .menu-toggle { background: #007bff; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .btn-subject-toggle { background: #4a5568; }
    .sidebar { position: fixed; top: 0; width: 300px; height: 100%; background: #fff; box-shadow: 0 0 16px rgba(0,0,0,0.2); z-index: 1001; transition: 0.3s; overflow-y: auto; padding: 20px 16px; }
    .sidebar-left { left: -300px; } .sidebar-left.open { left: 0; }
    .sidebar-right { right: -300px; } .sidebar-right.open { right: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px; }
    .sidebar-list { list-style: none; }
    .sidebar-list a { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #334155; text-decoration: none; font-size: 0.95rem; }
    .sidebar-list a.active { background: #ebf8ff; color: #007bff; font-weight: bold; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; display: none; }
    .overlay.open { display: block; }

    /* メインコンテナ */
    .container { max-width: 900px; width: 92%; margin: 0 auto; padding: 24px 0 60px; }
    .lesson-header { margin-bottom: 20px; }
    .lesson-badge { display: inline-block; background: #ebf8ff; color: #007bff; font-weight: bold; padding: 3px 12px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 6px; }
    .lesson-title { font-size: 1.6rem; color: #1a202c; }

    /* 3ステップ切替タブ */
    .step-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .step-tab {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #475569;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .step-tab:hover { border-color: #93c5fd; }
    .step-tab.active {
      border-color: #007bff;
      background: #ebf8ff;
      color: #007bff;
    }
    .status-pill {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #64748b;
    }
    .status-pill.done {
      background: #dcfce7;
      color: #15803d;
    }

    /* コンテンツパネル */
    .step-panel {
      display: none;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .step-panel.active { display: block; }

    /* 16:9 YouTubeレスポンシブ枠 */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      margin-bottom: 20px;
    }
    .video-wrapper iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    /* 完了ボタン */
    .complete-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-complete {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-complete.completed {
      background: #e2e8f0;
      color: #475569;
    }
    .btn-next {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.95rem;
    }

    /* ③ 理解度チェック（クイズ） */
    .quiz-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .quiz-q { font-weight: bold; font-size: 1.05rem; margin-bottom: 12px; color: #1e293b; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-option {
      text-align: left;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 0.95rem;
      transition: 0.15s;
    }
    .quiz-option:hover { background: #eff6ff; border-color: #93c5fd; }
    .quiz-result {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
    }
    .quiz-result.correct { display: block; background: #dcfce7; color: #166534; }
    .quiz-result.incorrect { display: block; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <nav class="global-nav">
    <button class="menu-toggle btn-subject-toggle" onclick="toggleSubjectSidebar()">📚 他科目へ</button>
    <a href="/otamesi/index.html" class="nav-portal-title">🏠 大学院受験予備校</a>
    <button class="menu-toggle" onclick="toggleLessonSidebar()">☰ 講義一覧</button>
  </nav>

  <div class="overlay" id="overlay" onclick="closeAllSidebars()"></div>
  <aside class="sidebar sidebar-left" id="subjectSidebar"></aside>
  <aside class="sidebar sidebar-right" id="lessonSidebar"></aside>

  <div class="container">
    <div class="lesson-header">
      <span class="lesson-badge">解析学Ⅰ / 第1講</span>
      <h1 class="lesson-title">導入、極限、挟み撃ちの原理</h1>
    </div>

    <!-- 3ステップ切替ナビ -->
    <div class="step-tabs">
      <button class="step-tab active" data-step="lecture" onclick="switchStep('lecture')">
        <span>① 講義動画</span>
        <span class="status-pill" id="badge-lecture">未視聴</span>
      </button>
      <button class="step-tab" data-step="exercise" onclick="switchStep('exercise')">
        <span>② 演習解説動画</span>
        <span class="status-pill" id="badge-exercise">未視聴</span>
      </button>
      <button class="step-tab" data-step="quiz" onclick="switchStep('quiz')">
        <span>③ 理解度チェック</span>
        <span class="status-pill" id="badge-quiz">未解答</span>
      </button>
    </div>

    <!-- ① 講義動画パネル -->
    <section class="step-panel active" id="panel-lecture">
      <div class="video-wrapper">
        <!-- YouTube動画IDを差し替えてください -->
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      </div>
      <div class="complete-bar">
        <button class="btn-complete" id="btn-done-lecture" onclick="toggleVideoDone('lecture')">✓ 講義動画を完了にする</button>
        <button class="btn-next" onclick="switchStep('exercise')">② 演習解説動画へ進む →</button>
      </div>
    </section>

    <!-- ② 演習解説動画パネル -->
    <section class="step-panel" id="panel-exercise">
      <div class="video-wrapper">
        <!-- 演習動画IDを差し替えてください -->
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      </div>
      <div class="complete-bar">
        <button class="btn-complete" id="btn-done-exercise" onclick="toggleVideoDone('exercise')">✓ 演習解説を完了にする</button>
        <button class="btn-next" onclick="switchStep('quiz')">③ 理解度チェックへ進む →</button>
      </div>
    </section>

    <!-- ③ 理解度チェックパネル -->
    <section class="step-panel" id="panel-quiz">
      <!-- 問題1 -->
      <div class="quiz-item" data-qid="q1" data-answer="1">
        <div class="quiz-q">Q1. lim(x→0) (sin x / x) の値はどれか？</div>
        <div class="quiz-options">
          <button class="quiz-option" onclick="answerQuiz('q1', 0, 1, '解説：挟み撃ちの原理より 1 に収束します。')">0</button>
          <button class="quiz-option" onclick="answerQuiz('q1', 1, 1, '解説：挟み撃ちの原理より 1 に収束します。')">1</button>
          <button class="quiz-option" onclick="answerQuiz('q1', 2, 1, '解説：挟み撃ちの原理より 1 に収束します。')">∞（発散）</button>
        </div>
        <div class="quiz-result" id="result-q1"></div>
      </div>

      <!-- 問題2 -->
      <div class="quiz-item" data-qid="q2" data-answer="2">
        <div class="quiz-q">Q2. 挟み撃ちの原理が成立するための条件として正しいものは？</div>
        <div class="quiz-options">
          <button class="quiz-option" onclick="answerQuiz('q2', 0, 2, '解説：両端の関数が同じ極限値 α に収束する必要があります。')">両端の関数が単調増加であること</button>
          <button class="quiz-option" onclick="answerQuiz('q2', 1, 2, '解説：両端の関数が同じ極限値 α に収束する必要があります。')">真ん中の関数が連続であること</button>
          <button class="quiz-option" onclick="answerQuiz('q2', 2, 2, '解説：両端の関数が同じ極限値 α に収束する必要があります。')">両端の関数が同じ極限値に収束すること</button>
        </div>
        <div class="quiz-result" id="result-q2"></div>
      </div>

      <div class="complete-bar">
        <a href="index.html" class="btn-next" style="background:#475569;">← 講義一覧（進捗確認）へ戻る</a>
        <a href="lesson02.html" class="btn-next">次の講（第2講）へ →</a>
      </div>
    </section>
  </div>

  <script>
    // ★この講義の識別ID（第2講なら 'lesson02' に変更）
    const LESSON_ID = 'lesson01';
    const STORAGE_KEY = 'edu_progress_kaiseki1';

    // localStorageから学習データを取得
    function getProgressData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : {};
      if (!data[LESSON_ID]) {
        data[LESSON_ID] = { lecture: false, exercise: false, quiz: {} };
      }
      return data;
    }

    // localStorageへ保存して画面表示を更新
    function saveProgressData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderProgressUI();
    }

    // 画面上のバッジ・完了ボタン・クイズ履歴を復元
    function renderProgressUI() {
      const data = getProgressData()[LESSON_ID];

      // ① 講義動画の状態反映
      const badgeLec = document.getElementById('badge-lecture');
      const btnLec = document.getElementById('btn-done-lecture');
      if (data.lecture) {
        badgeLec.textContent = '視聴済';
        badgeLec.classList.add('done');
        btnLec.textContent = '✓ 視聴完了済み（クリックで解除）';
        btnLec.classList.add('completed');
      } else {
        badgeLec.textContent = '未視聴';
        badgeLec.classList.remove('done');
        btnLec.textContent = '✓ 講義動画を完了にする';
        btnLec.classList.remove('completed');
      }

      // ② 演習解説の状態反映
      const badgeEx = document.getElementById('badge-exercise');
      const btnEx = document.getElementById('btn-done-exercise');
      if (data.exercise) {
        badgeEx.textContent = '視聴済';
        badgeEx.classList.add('done');
        btnEx.textContent = '✓ 視聴完了済み（クリックで解除）';
        btnEx.classList.add('completed');
      } else {
        badgeEx.textContent = '未視聴';
        badgeEx.classList.remove('done');
        btnEx.textContent = '✓ 演習解説を完了にする';
        btnEx.classList.remove('completed');
      }

      // ③ クイズの正誤結果の復元
      const quizItems = document.querySelectorAll('.quiz-item');
      let correctCount = 0;
      quizItems.forEach(item => {
        const qid = item.getAttribute('data-qid');
        const status = data.quiz[qid];
        const resBox = document.getElementById('result-' + qid);
        if (status === 'correct') {
          correctCount++;
          resBox.textContent = '⭕ 前回の結果：正解！';
          resBox.className = 'quiz-result correct';
        } else if (status === 'incorrect') {
          resBox.textContent = '❌ 前回の結果：不正解（再挑戦できます）';
          resBox.className = 'quiz-result incorrect';
        }
      });

      const badgeQuiz = document.getElementById('badge-quiz');
      if (Object.keys(data.quiz).length > 0) {
        badgeQuiz.textContent = `${correctCount} / ${quizItems.length} 正解`;
        if (correctCount === quizItems.length) badgeQuiz.classList.add('done');
        else badgeQuiz.classList.remove('done');
      }
    }

    // 動画の完了トグル
    function toggleVideoDone(type) {
      const data = getProgressData();
      data[LESSON_ID][type] = !data[LESSON_ID][type];
      saveProgressData(data);
    }

    // クイズ回答時の処理（正解・不正解をlocalStorageに記録）
    function answerQuiz(qid, selectedIndex, correctIndex, explanation) {
      const data = getProgressData();
      const isCorrect = (selectedIndex === correctIndex);
      data[LESSON_ID].quiz[qid] = isCorrect ? 'correct' : 'incorrect';
      saveProgressData(data);

      const resBox = document.getElementById('result-' + qid);
      if (isCorrect) {
        resBox.textContent = '⭕ 正解！ ' + explanation;
        resBox.className = 'quiz-result correct';
      } else {
        resBox.textContent = '❌ 不正解… ' + explanation;
        resBox.className = 'quiz-result incorrect';
      }
    }

    // タブ切替（URLハッシュ #lecture / #exercise / #quiz と連動）
    function switchStep(stepName) {
      document.querySelectorAll('.step-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));

      document.querySelector(`.step-tab[data-step="${stepName}"]`).classList.add('active');
      document.getElementById('panel-' + stepName).classList.add('active');
      history.replaceState(null, null, '#' + stepName);
    }

    // ページ読み込み時にURLハッシュ（indexからのダイレクトリンク）を判定
    window.addEventListener('DOMContentLoaded', () => {
      renderProgressUI();
      const hash = window.location.hash.replace('#', '');
      if (['lecture', 'exercise', 'quiz'].includes(hash)) {
        switchStep(hash);
      }
    });

    // サイドバー読み込み（既存共通）
    fetch('/otamesi/sidebar-left.html').then(r => r.text()).then(d => {
      document.getElementById('subjectSidebar').innerHTML = d;
      document.querySelectorAll('#subjectSidebar a').forEach(a => {
        if (a.getAttribute('href')?.includes('kaiseki1')) a.classList.add('active');
      });
    });
    fetch('sidebar-lesson.html').then(r => r.text()).then(d => {
      document.getElementById('lessonSidebar').innerHTML = d;
      const cur = window.location.pathname.split('/').pop();
      document.querySelectorAll('#lessonSidebar a').forEach(a => {
        if (a.getAttribute('href') === cur) a.classList.add('active');
      });
    });

    function toggleSubjectSidebar() { closeAllSidebars(); document.getElementById('subjectSidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
    function toggleLessonSidebar() { closeAllSidebars(); document.getElementById('lessonSidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
    function closeAllSidebars() { document.getElementById('subjectSidebar').classList.remove('open'); document.getElementById('lessonSidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
  </script>
</body>
</html>
