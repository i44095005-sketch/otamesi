<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>初級物理 - 講義一覧と学習進捗</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      overflow-x: hidden; /* 画面の左右はみ出し・横スクロールを完全に禁止 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding-top: 60px;
      text-align: left;
    }

    /* 🌐 グローバルナビ（上部固定ヘッダー） */
    .global-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      box-sizing: border-box;
      height: 56px;
      background-color: #1a202c;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    .nav-portal-title {
      font-weight: bold;
      font-size: 1rem;
      color: #ffffff;
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .nav-portal-title:hover { opacity: 0.8; }

    /* メニュー切替ボタン */
    .menu-toggle {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .btn-subject-toggle { background: #4a5568; }
    .btn-subject-toggle:hover { background: #718096; }

    /* 共通サイドバー設定（元のリッチデザイン復元） */
.sidebar {
      position: fixed;
      top: 0;
      width: 300px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 16px rgba(0,0,0,0.2);
      z-index: 1001;
      transition: all 0.3s ease;
      overflow-y: auto;
      padding: 20px 16px;
      visibility: hidden; /* 閉じている時は完全に非表示にしてはみ出し防止 */
    }
    .sidebar.open {
      visibility: visible; /* 開いた時だけ表示 */
    }
    .sidebar-left { left: -300px; }
    .sidebar-left.open { left: 0; }
    .sidebar-right { right: -300px; }
    .sidebar-right.open { right: 0; }
    
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .sidebar-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1a202c;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #a0aec0;
      padding: 0 8px;
      line-height: 1;
    }
    .close-btn:hover { color: #4a5568; }

/* 左サイドバーの横並び崩れを強制的に縦並びへ修正 */
    .sidebar-list {
      list-style: none;
      padding-left: 0;
      margin-left: 0;
    }
    .sidebar-list li {
      display: block !important;
      width: 100% !important;
      margin-bottom: 6px !important;
    }
    
 /* カテゴリ見出し（見出し1行分だけに短い青い縦線を引く） */
    .sidebar-category-head {
      font-size: 0.82rem;
      font-weight: bold;
      color: #334155;
      background-color: #f1f5f9;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 16px;
      margin-bottom: 8px;
      display: block;
      border-left: 3px solid #007bff;
    }
    .sidebar-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      color: #334155;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .sidebar-list a:hover { background: #f1f5f9; color: #007bff; }
    .sidebar-list a.active {
      background: #ebf8ff;
      color: #007bff;
      font-weight: bold;
      border: 1px solid #bae6fd;
    }

    /* トップへ戻るボタン */
    .sidebar-btn-home {
      background: #f1f5f9 !important;
      border: 1px solid #cbd5e1 !important;
      font-weight: bold !important;
      color: #334155 !important;
      margin-bottom: 12px;
    }
    .sidebar-btn-home:hover { background: #e2e8f0 !important; color: #007bff !important; }

    /* 準備中リンクとバッジ */
    .sidebar-list a.disabled-link { color: #94a3b8; pointer-events: none; }
    .badge-prep {
      font-size: 0.75rem;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: normal;
    }

    /* 背景オーバーレイ */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 1000; display: none;
    }
    .overlay.open { display: block; }

    /* メインコンテナ */
    .container { max-width: 1000px; width: 92%; margin: 0 auto; padding: 30px 0 60px; }

    /* 学習進捗サマリーバー */
    .progress-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 28px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      width: 100%;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .progress-title { font-size: 1.5rem; font-weight: bold; color: #1a202c; }
    .progress-stats { font-size: 0.95rem; font-weight: bold; color: #007bff; }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #007bff, #10b981);
      transition: width 0.4s ease;
    }

    /* 講義リスト（横長カードで①②③への直通リンクを見やすく配置） */
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .lesson-row {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      width: 100%;
      transition: border-color 0.2s;
    }
    .lesson-row:hover { border-color: #93c5fd; }
    .lesson-info { flex: 1; min-width: 240px; text-align: left; }
    .lesson-num {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: bold;
      color: #007bff;
      background: #ebf8ff;
      padding: 2px 10px;
      border-radius: 12px;
      margin-bottom: 4px;
    }
    .lesson-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #1e293b;
      text-decoration: none;
      display: block;
    }
    .lesson-name:hover { color: #007bff; }

    /* ①②③ ダイレクトジャンプボタン群 */
    .step-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .step-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      transition: 0.15s;
      white-space: nowrap;
    }
    .step-btn:hover {
      background: #e2e8f0;
      color: #1e293b;
    }
    /* 完了時のスタイル（緑） */
    .step-btn.done {
      background: #dcfce7;
      color: #15803d;
      border-color: #86efac;
    }
    /* クイズ一部不正解ありのスタイル（黄） */
    .step-btn.partial {
      background: #fef3c7;
      color: #b45309;
      border-color: #fcd34d;
    }
  </style>
</head>
<body>

  <nav class="global-nav">
    <button class="menu-toggle btn-subject-toggle" onclick="toggleSubjectSidebar()">📚 他科目へ</button>
    <a href="/otamesi/index.html" class="nav-portal-title">🏠 大学院受験予備校</a>
    <button class="menu-toggle" onclick="toggleLessonSidebar()">☰ 講義一覧</button>
  </nav>

  <div class="overlay" id="overlay" onclick="closeAllSidebars()"></div>
  <aside class="sidebar sidebar-left" id="subjectSidebar"></aside>
  <aside class="sidebar sidebar-right" id="lessonSidebar"></aside>

  <div class="container">
    <!-- 学習進捗ダッシュボード -->
    <div class="progress-box">
      <div class="progress-header">
        <h1 class="progress-title">📘 初級物理</h1>
        <span class="progress-stats" id="overallStats">進捗率: 0%（0 / 45 ステップ完了）</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="overallBar"></div>
      </div>
    </div>

    <!-- JavaScriptで全15講のリストと①②③ダイレクトリンクを自動生成 -->
    <main class="lesson-list" id="lessonListContainer"></main>
  </div>

  <script>
    const STORAGE_KEY = 'edu_progress_shokyu_buturi';

    // 講義データ一覧
    const LESSONS = [
      { id: 'lesson01', num: '第1講', title: '速度と加速度', file: 'lesson01.html', quizTotal: 2 },
      { id: 'lesson02', num: '第2講', title: '落体の運動', file: 'lesson02.html', quizTotal: 2 },
      { id: 'lesson03', num: '第3講', title: '力のつり合い、運動の3法則', file: 'lesson03.html', quizTotal: 2 },
      { id: 'lesson04', num: '第4講', title: '剛体', file: 'lesson04.html', quizTotal: 2 },
      { id: 'lesson05', num: '第5講', title: '仕事とエネルギー', file: 'lesson05.html', quizTotal: 2 },
      { id: 'lesson06', num: '第6講', title: '運動量保存則', file: 'lesson06.html', quizTotal: 2 },
      { id: 'lesson07', num: '第7講', title: '万有引力、等速円運動', file: 'lesson07.html', quizTotal: 2 },
      { id: 'lesson08', num: '第8講', title: '慣性力、単振動', file: 'lesson08.html', quizTotal: 2 },
      { id: 'lesson09', num: '第9講', title: '力学分野のまとめ', file: 'lesson09.html', quizTotal: 2 },
      { id: 'lesson10', num: '第10講', title: '波の性質', file: 'lesson10.html', quizTotal: 2 },
      { id: 'lesson11', num: '第11講', title: '音の性質、ドップラー効果', file: 'lesson11.html', quizTotal: 2 },
      { id: 'lesson12', num: '第12講', title: '光の性質、レンズ', file: 'lesson12.html', quizTotal: 2 },
      { id: 'lesson13', num: '第13講', title: '光の干渉と回折', file: 'lesson13.html', quizTotal: 2 },
      { id: 'lesson14', num: '第14講', title: '波動分野のまとめ', file: 'lesson14.html', quizTotal: 2 },
      { id: 'lesson15', num: '第15講', title: '静電気力、電場と電位', file: 'lesson15.html', quizTotal: 2 }
    ];

    function renderDashboard() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const progressData = raw ? JSON.parse(raw) : {};
      const container = document.getElementById('lessonListContainer');
      container.innerHTML = '';

      let completedSteps = 0;
      const totalSteps = LESSONS.length * 3; // 各講 3ステップ（①講義・②演習・③理解度チェック）

      LESSONS.forEach(lesson => {
        const state = progressData[lesson.id] || { lecture: false, exercise: false, quiz: {} };

        // ① 講義動画ステータス
        if (state.lecture) completedSteps++;
        const lecClass = state.lecture ? 'step-btn done' : 'step-btn';
        const lecMark = state.lecture ? '✓' : '▶';

        // ② 演習解説ステータス
        if (state.exercise) completedSteps++;
        const exClass = state.exercise ? 'step-btn done' : 'step-btn';
        const exMark = state.exercise ? '✓' : '▶';

        // ③ 理解度チェックステータス（正解・不正解の集計）
        const quizResults = Object.values(state.quiz || {});
        const correctCount = quizResults.filter(v => (typeof v === 'object' ? v.status : v) === 'correct').length;
        const answeredCount = quizResults.length;
        let quizClass = 'step-btn';
        let quizLabel = '③ 理解度チェック';
        if (answeredCount > 0) {
          quizLabel = `③ チェック (${correctCount}/${lesson.quizTotal}正解)`;
          if (correctCount === lesson.quizTotal) {
            quizClass = 'step-btn done';
            completedSteps++;
          } else {
            quizClass = 'step-btn partial';
          }
        }

        const row = document.createElement('div');
        row.className = 'lesson-row';
        row.innerHTML = `
          <div class="lesson-info">
            <span class="lesson-num">${lesson.num}</span>
            <a href="${lesson.file}" class="lesson-name">${lesson.title}</a>
          </div>
          <div class="step-links">
            <a href="${lesson.file}#lecture" class="${lecClass}">${lecMark} ① 講義動画</a>
            <a href="${lesson.file}#exercise" class="${exClass}">${exMark} ② 演習解説</a>
            <a href="${lesson.file}#quiz" class="${quizClass}">${quizLabel}</a>
          </div>
        `;
        container.appendChild(row);
      });

      // 全体進捗率の更新
      const percent = Math.round((completedSteps / totalSteps) * 100);
      document.getElementById('overallStats').textContent = `進捗率: ${percent}%（${completedSteps} / ${totalSteps} ステップ完了）`;
      document.getElementById('overallBar').style.width = percent + '%';
    }

    window.addEventListener('DOMContentLoaded', renderDashboard);

    // サイドバー読み込み
    fetch('/otamesi/sidebar-left.html').then(r => r.text()).then(d => {
      document.getElementById('subjectSidebar').innerHTML = d;
      document.querySelectorAll('#subjectSidebar a').forEach(a => {
        if (a.getAttribute('href')?.includes('shokyu-buturi')) a.classList.add('active');
      });
    });
    fetch('sidebar-lesson.html').then(r => r.text()).then(d => {
      document.getElementById('lessonSidebar').innerHTML = d;
      const cur = window.location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('#lessonSidebar a').forEach(a => {
        if (a.getAttribute('href') === cur) a.classList.add('active');
      });
    });

    function toggleSubjectSidebar() { closeAllSidebars(); document.getElementById('subjectSidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
    function toggleLessonSidebar() { closeAllSidebars(); document.getElementById('lessonSidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
    function closeAllSidebars() { document.getElementById('subjectSidebar').classList.remove('open'); document.getElementById('lessonSidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
  </script>
</body>
</html>
