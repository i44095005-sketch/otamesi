<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>オンライン講座 - 科目一覧</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding-top: 60px;
      padding-bottom: 40px;
    }

    /* 🌐 グローバルナビ */
    .global-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background-color: #1a202c;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nav-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #ffffff;
      text-decoration: none;
    }

    /* メインコンテナ */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 15px;
    }
    
    header {
      margin-bottom: 32px;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    header p {
      font-size: 0.95rem;
      font-weight: 300;
      color: #64748b;
    }

    /* 科目一覧グリッド */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* 科目カード */
    .subject-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      text-decoration: none;
      color: #2d3748;
      transition: all 0.2s ease;
    }
    .subject-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      border-color: #007bff;
    }
    .subject-card.disabled {
      pointer-events: none;
      background: #f1f5f9;
      opacity: 0.7;
    }

    .subject-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .subject-tag {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: bold;
      color: #2b6cb0;
      background-color: #ebf8ff;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid #bee3f8;
    }
    .subject-tag.disabled-tag {
      color: #64748b;
      background-color: #e2e8f0;
      border-color: #cbd5e1;
    }

    .subject-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #1a202c;
    }

    .subject-desc {
      font-size: 0.9rem;
      font-weight: 300;
      color: #64748b;
    }

    .arrow-icon {
      font-size: 1.4rem;
      color: #a0aec0;
      margin-left: 16px;
      flex-shrink: 0;
    }
    .subject-card:hover .arrow-icon {
      color: #007bff;
    }

    @media (min-width: 600px) {
      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- 🌐 固定上部ナビゲーション -->
  <nav class="global-nav">
    <span class="nav-title">🎓 オンライン講義ポータル</span>
  </nav>

  <div class="container">
    <header>
      <h1>開講科目一覧</h1>
      <p>受講したい科目を選択してください。</p>
    </header>

    <main class="subject-grid">

      <!-- 解析学Ⅰ（kaiseki1/index.html へリンク） -->
      <a href="kaiseki1/index.html" class="subject-card">
        <div class="subject-info">
          <span class="subject-tag">開講中</span>
          <span class="subject-title">📘 解析学Ⅰ</span>
          <span class="subject-desc">極限、微分法、積分法、広義積分、偏微分の基礎（全15講）</span>
        </div>
        <span class="arrow-icon">→</span>
      </a>

      <!-- 解析学Ⅱ（準備中） -->
      <div class="subject-card disabled">
        <div class="subject-info">
          <span class="subject-tag disabled-tag">準備中</span>
          <span class="subject-title">📗 解析学Ⅱ</span>
          <span class="subject-desc">重積分、ベクトル解析、微分方程式の基礎</span>
        </div>
      </div>

      <!-- 線形代数（準備中） -->
      <div class="subject-card disabled">
        <div class="subject-info">
          <span class="subject-tag disabled-tag">準備中</span>
          <span class="subject-title">📙 線形代数</span>
          <span class="subject-desc">行列、行列式、連立一次方程式、固有値問題</span>
        </div>
      </div>

      <!-- 微分方程式（準備中） -->
      <div class="subject-card disabled">
        <div class="subject-info">
          <span class="subject-tag disabled-tag">準備中</span>
          <span class="subject-title">📕 微分方程式</span>
          <span class="subject-desc">常微分方程式の解法と物理・工学への応用</span>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
