<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索エンジンにヒットさせない設定（お試し・限定公開用） -->
  <meta name="robots" content="noindex, nofollow">
  <title>オンライン講座 - 講義一覧</title>
  <style>
    /* 全体基本設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding: 30px 15px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    /* ヘッダー */
    header {
      margin-bottom: 32px;
      text-align: center;
    }
    header h1 {
      font-size: 1.8rem;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    header p {
      font-size: 1rem;
      color: #666;
    }

    /* 講義一覧グリッド（スマホは1列、PC・タブレットは複数列） */
    .lesson-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* 講義カードリンク */
    .lesson-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 18px 24px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      text-decoration: none;
      color: #2d3748;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .lesson-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      border-color: #007bff;
      color: #007bff;
    }
    .lesson-number {
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .arrow-icon {
      font-size: 1.2rem;
      color: #a0aec0;
    }
    .lesson-card:hover .arrow-icon {
      color: #007bff;
    }

    /* 💻 PC・タブレット表示時のレイアウト（2列〜3列表示） */
    @media (min-width: 600px) {
      .lesson-grid {
        grid-template-columns: repeat(2, 1fr); /* 2列並び */
        gap: 20px;
      }
    }
    @media (min-width: 900px) {
      header h1 {
        font-size: 2.2rem;
      }
      .lesson-grid {
        grid-template-columns: repeat(3, 1fr); /* 3列並び */
      }
    }
  </style>
</head>
<body>

    </header>

    <main class="lesson-grid">
