<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>オンライン講座 - 科目一覧</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding-top: 60px;
      padding-bottom: 40px;
    }

    /* 🌐 グローバルナビ（上部固定ヘッダー） */
    .global-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background-color: #1a202c;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nav-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: #ffffff;
      text-decoration: none;
      white-space: nowrap;
    }

    /* メニュー切替ボタン */
    .menu-toggle {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .btn-subject-toggle {
      background: #4a5568;
    }
    .btn-subject-toggle:hover {
      background: #718096;
    }

    /* 共通サイドバー設定 */
    .sidebar {
      position: fixed;
      top: 0;
      width: 280px;
      height: 100%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(0,0,0,0.15);
      z-index: 1001;
      transition: all 0.3s ease;
      overflow-y: auto;
      padding: 20px;
    }
    .sidebar-left { left: -280px; }
    .sidebar-left.open { left: 0; }
    .sidebar-right { right: -280px; }
    .sidebar-right.open { right: 0; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .sidebar-title { font-size: 1.1rem; font-weight: bold; color: #2d3748; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #718096; }
    .sidebar-list { list-style: none; }
    .sidebar-list li { margin-bottom: 8px; }
    .sidebar-list a {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      color: #4a5568;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .sidebar-list a:hover { background: #edf2f7; color: #007bff; }
    .sidebar-list a.active { background: #ebf8ff; color: #007bff; font-weight: bold; }

    /* 背景オーバーレイ */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); z-index: 1000; display: none;
    }
    .overlay.open { display: block; }

    /* メインコンテナ */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 15px;
    }
    
    header {
      margin-bottom: 32px;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    header p {
      font-size: 0.95rem;
      font-weight: 300;
      color: #64748b;
    }

    /* 科目一覧グリッド */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* 科目カード */
    .subject-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      text-decoration: none;
      color: #2d3748;
      transition: all 0.2s ease;
    }
    .subject-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      border-color: #007bff;
    }
    .subject-card.disabled {
      pointer-events: none;
      background: #f1f5f9;
      opacity: 0.7;
    }

    .subject-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .subject-tag {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: bold;
      color: #2b6cb0;
      background-color: #ebf8ff;
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid #bee3f8;
    }
    .subject-tag.disabled-tag {
      color: #64748b;
      background-color: #e2e8f0;
      border-color: #cbd5e1;
    }

    .subject-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #1a202c;
    }

    .subject-desc {
      font-size: 0.9rem;
      font-weight: 300;
      color: #64748b;
    }

    .arrow-icon {
      font-size: 1.4rem;
      color: #a0aec0;
      margin-left: 16px;
      flex-shrink: 0;
    }
    .subject-card:hover .arrow-icon {
      color: #007bff;
    }

    @media (min-width: 600px) {
      .subject-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- 🌐 固定上部ナビゲーション -->
  <nav class="global-nav">
    <button class="menu-toggle btn-subject-toggle" onclick="toggleSubjectSidebar()">📚 他科目へ</button>
    <a href="index.html" class="nav-title">🎓 オンライン講義</a>
    <button class="menu-toggle" onclick="toggleLessonSidebar()">☰ 講義一覧</button>
  </nav>

  <div class="overlay" id="overlay" onclick="closeAllSidebars()"></div>

  <!-- 👈 左側スライド：科目一覧サイドバー -->
  <aside class="sidebar sidebar-left" id="subjectSidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">科目選択</span>
      <button class="close-btn" onclick="closeAllSidebars()">×</button>
    </div>
    <ul class="sidebar-list">
      <li><a href="kaiseki1/index.html">📘 解析学Ⅰ</a></li>
      <li><a href="#">📗 解析学Ⅱ（準備中）</a></li>
      <li><a href="#">📙 線形代数（準備中）</a></li>
      <li><a href="#">📕 微分方程式（準備中）</a></li>
      <li><a href="#">📓 確率統計（準備中）</a></li>
    </ul>
  </aside>

  <div class="container">
    <header>
      <h1>開講科目一覧</h1>
      <p>受講したい科目を選択してください。</p>
    </header>

    <main class="subject-grid">

      <!-- 解析学Ⅰ -->
      <a href="kaiseki1/index.html" class="subject-card">
        <div class="subject-info">
          <span class="subject-tag">開講中</span>
          <span class="subject-title">📘 解析学Ⅰ</span>
          <span class="subject-desc">極限、微分法、積分法、広義積分、偏微分の基礎（全15講）</span>
        </div>
        <span class="arrow-icon">→</span>
      </a>

      <!-- 解析学Ⅱ（準備中） -->
      <div class="subject-card disabled">
        <div class="subject-info">
          <span class="subject-tag disabled-tag">準備中</span>
          <span class="subject-title">📗 解析学Ⅱ</span>
          <span class="subject-desc">重積分、ベクトル解析、微分方程式の基礎</span>
        </div>
      </div>

      <!-- 線形代数（準備中） -->
      <div class="subject-card disabled">
        <div class="subject-info">
          <span class="subject-tag disabled-tag">準備中</span>
          <span class="subject-title">📙 線形代数</span>
          <span class="subject-desc">行列、行列式、連立一次方程式、固有値問題</span>
        </div>
      </div>

      <!-- 微分方程式（準備中） -->
      <div class="subject-card disabled">
        <div class="subject-info">
          <span class="subject-tag disabled-tag">準備中</span>
          <span class="subject-title">📕 微分方程式</span>
          <span class="subject-desc">常微分方程式の解法と物理・工学への応用</span>
        </div>
      </div>

    </main>
  </div>

  <script>
    function toggleSubjectSidebar() {
      closeAllSidebars();
      document.getElementById('subjectSidebar').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }
    function toggleLessonSidebar() {
      closeAllSidebars();
      document.getElementById('lessonSidebar').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }
    function closeAllSidebars() {
      document.getElementById('subjectSidebar').classList.remove('open');
      document.getElementById('lessonSidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }
  </script>

</body>
</html>
